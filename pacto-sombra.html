<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modo sombra · API da Pacto — CrossTainer</title>
  <meta name="robots" content="noindex">

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>

  <style>
    /* Tokens do professores.html — nenhuma variável inventada */
    :root {
      --bg: #0a0a0a; --surface: #131315; --surface2: #1a1a1e; --surface3: #222226;
      --border: #2a2a30; --border2: #353538;
      --text: #eee9e0; --text2: #908a82; --text3: #5a5650;
      --orange: #E8920D; --orange-dim: rgba(232, 146, 13, 0.08); --accent: #E8920D;
      --green: #5cb85c; --green-bg: rgba(92, 184, 92, 0.08);
      --red: #e05a3a; --red-bg: rgba(224, 90, 58, 0.06);
      --blue: #5b9bd5; --blue-bg: rgba(91, 155, 213, 0.08);
      --yellow: #FDD835; --yellow-bg: rgba(253, 216, 53, 0.08);
      --radius: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.45; }
    header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
    header h1 { font-size: 16px; font-weight: 700; }
    header .sub { color: var(--text2); font-size: 12px; }
    header .esp { flex: 1; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border2); color: var(--text2); }
    .badge.staging { color: var(--yellow); border-color: var(--yellow); background: var(--yellow-bg); }
    .badge.production { color: var(--red); border-color: var(--red); background: var(--red-bg); }
    main { max-width: 1180px; margin: 0 auto; padding: 20px; display: grid; gap: 16px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
    .card h2 { font-size: 14px; margin-bottom: 10px; }
    .muted { color: var(--text2); font-size: 12.5px; }
    .aviso { background: var(--yellow-bg); border: 1px solid var(--yellow); color: var(--text); border-radius: var(--radius); padding: 10px 12px; font-size: 13px; }
    .erro { background: var(--red-bg); border: 1px solid var(--red); border-radius: var(--radius); padding: 10px 12px; font-size: 13px; }
    .linha { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
    label { display: grid; gap: 4px; font-size: 12px; color: var(--text2); }
    input, select { background: var(--surface2); color: var(--text); border: 1px solid var(--border2); border-radius: 6px; padding: 7px 9px; font-size: 13px; }
    button { background: var(--orange); color: #111; border: 0; border-radius: 6px; padding: 8px 14px; font-weight: 600; cursor: pointer; font-size: 13px; }
    button.sec { background: var(--surface3); color: var(--text); border: 1px solid var(--border2); }
    button:disabled { opacity: .5; cursor: default; }
    .dias { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
    .dia { border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12px; background: var(--surface2); }
    .dia b { display: block; font-size: 13px; }
    .dia.buscado { border-color: var(--green); }
    .dia.vazio_conferir, .dia.parcial, .dia.nao_buscado { border-color: var(--yellow); }
    .dia.falhou, .dia.credencial_recusada, .dia.limite { border-color: var(--red); background: var(--red-bg); }
    .lado { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
    .num { font-size: 22px; font-weight: 700; }
    .kv { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-size: 13px; margin-top: 6px; }
    .kv span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; }
    .drop { border: 2px dashed var(--border2); border-radius: var(--radius); padding: 22px; text-align: center; color: var(--text2); cursor: pointer; }
    .drop.sobre { border-color: var(--orange); background: var(--orange-dim); }
    .tabela { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { color: var(--text2); font-weight: 600; }
    td.v { text-align: right; font-variant-numeric: tabular-nums; }
    .pos { color: var(--green); } .neg { color: var(--red); }
    .login { max-width: 360px; margin: 60px auto; display: grid; gap: 10px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Modo sombra · API da Pacto</h1>
      <div class="sub">Conferência só do administrador. O arquivo exportado continua sendo o oficial — esta tela não mexe em comissão.</div>
    </div>
    <div class="esp"></div>
    <span id="ambiente" class="badge"></span>
    <span id="usuario" class="muted"></span>
    <button id="sair" class="sec" hidden>Sair</button>
  </header>

  <section id="telaLogin" class="card login" hidden>
    <h2>Entrar</h2>
    <label>E-mail <input id="loginEmail" type="email" autocomplete="username"></label>
    <label>Senha <input id="loginSenha" type="password" autocomplete="current-password"></label>
    <button id="entrar">Entrar</button>
    <div id="loginErro" class="erro" hidden></div>
  </section>

  <section id="telaRestrita" class="card login" hidden>
    <h2>Acesso restrito</h2>
    <p class="muted">Esta tela é só do administrador.</p>
  </section>

  <main id="app" hidden>
    <section class="card">
      <div class="linha">
        <label>Unidade
          <select id="unidade"><option value="CP">Campeche (CP)</option><option value="PP">Pequeno Príncipe (PP)</option></select>
        </label>
        <label>Mês <input id="mes" type="month"></label>
        <button id="carregar">Carregar</button>
        <span class="esp" style="flex:1"></span>
        <button id="buscarAgora" class="sec" title="Busca na Pacto os dias do mês escolhido até ontem, nas duas unidades">Buscar este mês agora na Pacto</button>
      </div>
      <p id="buscaStatus" class="muted" style="margin-top:8px"></p>
    </section>

    <section class="card">
      <h2>Dias buscados</h2>
      <div id="avisosDias"></div>
      <div id="dias" class="dias"></div>
    </section>

    <section class="card">
      <h2>O que a API trouxe no mês</h2>
      <div id="resumoApi"></div>
    </section>

    <section class="card">
      <h2>Comparar com o arquivo exportado</h2>
      <label id="drop" class="drop">
        Arraste aqui o <b>faturamento-recebido</b> exportado da Pacto, ou clique para escolher.
        <input id="arquivo" type="file" accept=".xls,.xlsx" hidden>
      </label>
      <div id="comparacao" style="margin-top:14px"></div>
    </section>
  </main>

  <script src="firebase-config.js?v=20260913"></script>
  <script src="pacto-adapter.js?v=20260917"></script>
  <script src="commission.js?v=20260913"></script>
  <script src="pacto-api-linhas.js?v=20260913"></script>
  <script src="pacto-sombra-comparacao.js?v=20260913"></script>
  <script src="pacto-sombra.js?v=20260913"></script>
</body>
</html>
